let allQuestions = [];
let questions = [];
let bloqueActual = 1;
const quiz = document.getElementById('quiz');

function shuffle(arr){
  const copy = [...arr];
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function mezclarOpcionesPregunta(question){
  const optionsWithIndex = question.options.map((text, index) => ({
    text,
    originalIndex: index
  }));

  const mixedOptions = shuffle(optionsWithIndex);
  const newAnswer = mixedOptions.findIndex(opt => opt.originalIndex === question.answer);

  return {
    ...question,
    options: mixedOptions.map(opt => opt.text),
    answer: newAnswer
  };
}

function prepararPreguntas(){
  allQuestions = originalQuestions.map(mezclarOpcionesPregunta);
}

function actualizarBotonesBloque(){
  document.getElementById('btn-bloque-1').classList.toggle('active', bloqueActual === 1);
  document.getElementById('btn-bloque-2').classList.toggle('active', bloqueActual === 2);
}

function cargarBloque(numero){
  bloqueActual = numero;

  if(numero === 1){
    questions = allQuestions.slice(0, 25);
    document.getElementById('bannerBlock').textContent = 'Estás en el Test 1.';
  } else {
    questions = allQuestions.slice(25, 50);
    document.getElementById('bannerBlock').textContent = 'Estás en el Test 2.';
  }

  actualizarBotonesBloque();
  renderQuiz();
  resetResumen();
  ocultarNota();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuiz(){
  quiz.innerHTML = '';
  const letras = ['A', 'B', 'C', 'D'];

  questions.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'quiz-item';
    div.id = `question-${index}`;

    const optionsHtml = item.options.map((option, i) => `
      <label class="option">
        <input type="radio" name="q${index}" value="${i}" onchange="corregirPregunta(${index}); actualizarResumen();">
        <span><strong>${letras[i]}.</strong> ${option}</span>
      </label>
    `).join('');

    div.innerHTML = `
      <h2 class="question-title">${index + 1}. ${item.q}</h2>
      <div class="options">${optionsHtml}</div>
      <div class="feedback" id="feedback-${index}"></div>
    `;
    quiz.appendChild(div);
  });

  document.getElementById('totalQuestions').textContent = questions.length;
}

function corregirPregunta(index){
  const item = questions[index];
  const selected = document.querySelector(`input[name="q${index}"]:checked`);
  const card = document.getElementById(`question-${index}`);
  const feedback = document.getElementById(`feedback-${index}`);

  card.classList.remove('correct','incorrect');
  feedback.classList.remove('show','ok','bad');

  if(!selected){
    feedback.classList.add('show','bad');
    feedback.innerHTML = `No has contestado esta pregunta.<div class="correct-answer">Respuesta correcta: <strong>${item.options[item.answer]}</strong></div>`;
    card.classList.add('incorrect');
    return;
  }

  const selectedValue = Number(selected.value);

  if(selectedValue === item.answer){
    card.classList.add('correct');
    feedback.classList.add('show','ok');
    feedback.innerHTML = `✅ Correcta.<div class="correct-answer">${item.explanation}</div>`;
  } else {
    card.classList.add('incorrect');
    feedback.classList.add('show','bad');
    feedback.innerHTML = `❌ Incorrecta.<div class="correct-answer">Respuesta correcta: <strong>${item.options[item.answer]}</strong></div><div class="correct-answer">${item.explanation}</div>`;
  }
}

function actualizarResumen(){
  let score = 0;
  let errors = 0;
  let answered = 0;

  questions.forEach((item, index) => {
    const selected = document.querySelector(`input[name="q${index}"]:checked`);
    if(selected){
      answered++;
      if(Number(selected.value) === item.answer) score++;
      else errors++;
    }
  });

  const grade = questions.length ? ((score / questions.length) * 10) : 0;

  document.getElementById('score').textContent = score;
  document.getElementById('errors').textContent = errors;
  document.getElementById('answered').textContent = answered;
  document.getElementById('grade').textContent = grade.toFixed(2);

  return grade;
}

function mostrarNota(grade){
  const gradeBox = document.getElementById('gradeBox');
  let mensaje = '';

  if(grade >= 9){
    mensaje = `🌟 Nota final: ${grade.toFixed(2)}/10 · Excelente.`;
  } else if(grade >= 5){
    mensaje = `✅ Nota final: ${grade.toFixed(2)}/10 · Aprobado.`;
  } else {
    mensaje = `📚 Nota final: ${grade.toFixed(2)}/10 · Toca repasar un poco más.`;
  }

  gradeBox.textContent = mensaje;
  gradeBox.classList.add('show');
}

function ocultarNota(){
  const gradeBox = document.getElementById('gradeBox');
  gradeBox.textContent = '';
  gradeBox.classList.remove('show');
}

function corregirTodo(){
  questions.forEach((_, index) => corregirPregunta(index));
  const grade = actualizarResumen();
  mostrarNota(grade);
  window.scrollTo({top:0, behavior:'smooth'});
}

function resetResumen(){
  document.getElementById('score').textContent = '0';
  document.getElementById('errors').textContent = '0';
  document.getElementById('answered').textContent = '0';
  document.getElementById('grade').textContent = '0.00';
}

function reiniciarExamen(){
  prepararPreguntas();
  cargarBloque(bloqueActual);
}

prepararPreguntas();
cargarBloque(1);
</script>
