<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Firebase iPhone</title>
  <script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=CBdNGmjEdTsoVIylMErB1DIxS-hY2iRA6V62z8d_p7nwLP-HO716Vw273NtV9ttvFYNQu0bRblK4ffteIAD9i4DC42dZvTTffIKod-z3OKVlFx3shss4wFGaDw2aC4lxcG9e-DQwhT6aR0DQhOolDsJHQtFCYI4sCDtEn9WdBY8T7-__3cpMhgIBOsu5kx6TqoOXCVzspSaxz4kfD_-8-HjJ20g_eQ14kByk_M-tH0y0NgDUTP2fzZXJUwseo_wnftmfE2KdtWmoS7o7ewUWRQ" charset="UTF-8"></script><style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(135deg,#fff8f2,#ffe8d6);
      color:#3e2617;
    }
    .card{
      width:min(520px,100%);
      background:#fff;
      border:1px solid #f2ccb0;
      border-radius:24px;
      padding:24px;
      box-shadow:0 14px 28px rgba(143,63,0,.12);
      text-align:center;
    }
    img{
      width:90px;
      height:90px;
      object-fit:cover;
      border-radius:24px;
      display:block;
      margin:0 auto 16px;
      background:#fff;
      padding:6px;
      box-shadow:0 10px 20px rgba(255,122,0,.18);
    }
    h1{
      margin:0 0 10px;
      color:#8e3d00;
      font-size:28px;
    }
    p{
      margin:0 0 10px;
      line-height:1.55;
      color:#7c5d48;
      font-size:15px;
    }
    .box{
      margin-top:14px;
      padding:12px 14px;
      border-radius:14px;
      font-weight:700;
      border:1px solid #f2ccb0;
      background:#fff8f2;
      color:#8e3d00;
    }
    .ok{
      background:#dcfce7;
      color:#15803d;
      border-color:#86efac;
    }
    .bad{
      background:#fee2e2;
      color:#b91c1c;
      border-color:#fca5a5;
      text-align:left;
      white-space:pre-wrap;
      word-break:break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./logo.png" alt="Logo">
    <h1>Prueba Firebase iPhone</h1>
    <p>Esta página solo comprueba si Safari puede cargar Firebase y arrancar el proyecto.</p>
    <div id="status" class="box">Cargando prueba…</div>
  </div>

  <script type="module">
    const statusBox = document.getElementById("status");

    function setStatus(text, cls=""){
      statusBox.className = "box " + cls;
      statusBox.textContent = text;
    }

    window.addEventListener("error", (e) => {
      setStatus("Error JS: " + e.message, "bad");
    });

    window.addEventListener("unhandledrejection", (e) => {
      setStatus("Promesa rechazada: " + String(e.reason), "bad");
    });

    async function run(){
      try{
        setStatus("Importando Firebase…");
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js");
        const { getAuth } = await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js");

        const firebaseConfig = {
          apiKey: "AIzaSyCkk4qjA7ziNF79bm418N9J_qKZ6R2O7dQ",
          authDomain: "uax-tests.firebaseapp.com",
          projectId: "uax-tests",
          databaseURL: "https://uax-tests-default-rtdb.firebaseio.com",
          storageBucket: "uax-tests.firebasestorage.app",
          messagingSenderId: "42201199894",
          appId: "1:42201199894:web:906ceb1a9ae9a5e58cfdb7",
          measurementId: "G-06KL27WT6W"
        };

        setStatus("Inicializando app…");
        const app = initializeApp(firebaseConfig);

        setStatus("Inicializando Auth…");
        getAuth(app);

        setStatus("Firebase carga correctamente en este iPhone.", "ok");
      }catch(error){
        setStatus("Firebase falla en este iPhone:\n\n" + (error?.message || String(error)), "bad");
      }
    }

    run();
  </script>
</body>
</html>
