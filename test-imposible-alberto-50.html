<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🔥 Test imposible de Alberto</title>
<style>
body{font-family:Arial;background:#111827;color:white;margin:0}
.wrapper{max-width:1000px;margin:auto;padding:30px}
.card{background:#1f2937;padding:20px;margin-bottom:15px;border-radius:10px;border:2px solid transparent}
.correct{background:#052e16;border-color:#22c55e}
.incorrect{background:#450a0a;border-color:#ef4444}
button{padding:12px 20px;font-weight:bold;background:#ef4444;color:white;border:none;border-radius:8px;cursor:pointer}
button:hover{box-shadow:0 0 15px red}
.option{display:block;margin:6px 0}
</style>
</head>
<body>
<div class="wrapper">
<h1>🔥 Test imposible de Alberto (50 preguntas)</h1>
<div id="quiz"></div>
<button onclick="corregirTodo()">Corregir todo</button>
</div>

<script>
const questions = [{"q": "¿Qué registro DNS contiene los parámetros de control de una zona y su número de serie?", "o": ["NS", "SOA", "TXT", "PTR"], "a": 1}, {"q": "¿Qué ataque DNS consiste en introducir respuestas falsas en la caché del resolvedor?", "o": ["DNS amplification", "DNS cache poisoning", "DNS tunneling", "DNS flooding"], "a": 1}, {"q": "¿Qué protocolo de transferencia de archivos funciona sobre SSH?", "o": ["FTP", "FTPS", "SFTP", "TFTP"], "a": 2}, {"q": "¿Qué comando en Apache habilita un módulo?", "o": ["apache-enable", "a2enmod", "enablemod", "modstart"], "a": 1}, {"q": "¿Qué código HTTP indica redirección permanente?", "o": ["200", "301", "403", "500"], "a": 1}, {"q": "¿Qué algoritmo moderno se usa frecuentemente en TLS para intercambio de claves?", "o": ["DES", "RSA", "ECDHE", "MD5"], "a": 2}, {"q": "¿Qué ataque permite capturar tráfico de red para analizarlo?", "o": ["Spoofing", "Sniffing", "Flooding", "Hijacking"], "a": 1}, {"q": "¿Qué protocolo utiliza el puerto 53?", "o": ["HTTP", "DNS", "SMTP", "FTP"], "a": 1}, {"q": "¿Qué variable PHP contiene información del servidor y cabeceras?", "o": ["$_GET", "$_POST", "$_SERVER", "$_SESSION"], "a": 2}, {"q": "¿Qué método HTTP es idempotente?", "o": ["POST", "GET", "PATCH", "CONNECT"], "a": 1}, {"q": "¿Qué registro DNS se usa para alias de dominio?", "o": ["CNAME", "MX", "NS", "PTR"], "a": 0}, {"q": "¿Qué puerto utiliza HTTPS por defecto?", "o": ["21", "25", "80", "443"], "a": 3}, {"q": "¿Qué comando Linux consulta registros DNS avanzados?", "o": ["ping", "dig", "route", "hostid"], "a": 1}, {"q": "¿Qué significa LAN?", "o": ["Local Area Network", "Large Access Node", "Link Area Network", "Logical Access Network"], "a": 0}, {"q": "¿Qué dispositivo trabaja principalmente en capa 2 OSI?", "o": ["Router", "Switch", "Firewall", "Proxy"], "a": 1}, {"q": "¿Qué protocolo asigna direcciones IP automáticamente?", "o": ["DNS", "DHCP", "FTP", "ARP"], "a": 1}, {"q": "¿Qué puerto usa SSH?", "o": ["21", "22", "23", "25"], "a": 1}, {"q": "¿Qué registro DNS define servidores de correo?", "o": ["MX", "A", "PTR", "TXT"], "a": 0}, {"q": "¿Qué protocolo se usa para enviar correo?", "o": ["SMTP", "POP3", "IMAP", "FTP"], "a": 0}, {"q": "¿Qué protocolo permite sincronizar correo en varios dispositivos?", "o": ["SMTP", "POP3", "IMAP", "FTP"], "a": 2}, {"q": "¿Qué formato de datos es común en APIs web modernas?", "o": ["XML", "JSON", "CSV", "TXT"], "a": 1}, {"q": "¿Qué etiqueta HTML crea un enlace?", "o": ["link", "href", "a", "url"], "a": 2}, {"q": "¿Qué atributo define el destino del enlace?", "o": ["src", "href", "dest", "link"], "a": 1}, {"q": "¿Qué lenguaje se ejecuta en el navegador?", "o": ["PHP", "Python", "JavaScript", "Java"], "a": 2}, {"q": "¿Qué significa CSS?", "o": ["Cascading Style Sheets", "Creative Style Syntax", "Control Style Sheet", "Computer Style System"], "a": 0}, {"q": "¿Qué comando SQL inserta datos?", "o": ["INSERT", "ADD", "NEW", "PUT"], "a": 0}, {"q": "¿Qué comando SQL elimina registros?", "o": ["REMOVE", "DELETE", "DROP", "CLEAR"], "a": 1}, {"q": "¿Qué comando SQL modifica registros existentes?", "o": ["ALTER", "CHANGE", "UPDATE", "MODIFY"], "a": 2}, {"q": "¿Qué significa URL?", "o": ["Uniform Resource Locator", "Universal Routing Link", "Unified Resource Level", "Uniform Route Logic"], "a": 0}, {"q": "¿Qué protocolo transporta páginas web?", "o": ["HTTP", "FTP", "SMTP", "POP3"], "a": 0}, {"q": "¿Qué diferencia principal hay entre HTTP y HTTPS?", "o": ["HTTPS usa UDP", "HTTPS añade cifrado TLS", "HTTP usa DNS", "HTTP es más seguro"], "a": 1}, {"q": "¿Qué formato de audio es sin pérdida?", "o": ["MP3", "FLAC", "AAC", "WMA"], "a": 1}, {"q": "¿Qué significa FPS en vídeo?", "o": ["Frames Per Second", "File Pixel Size", "Fast Pixel System", "Frame Packet Signal"], "a": 0}, {"q": "¿Qué reproductor multimedia libre es muy popular?", "o": ["VLC", "Photoshop", "AutoCAD", "WinZip"], "a": 0}, {"q": "¿Qué permite el streaming?", "o": ["Descargar primero", "Reproducir mientras llega", "Solo audio", "Solo vídeo"], "a": 1}, {"q": "¿Qué protocolo usa ping?", "o": ["TCP", "UDP", "ICMP", "ARP"], "a": 2}, {"q": "¿Qué identifica físicamente una tarjeta de red?", "o": ["MAC", "IP", "DNS", "PORT"], "a": 0}, {"q": "¿Qué máscara separa red y host?", "o": ["Subnet mask", "DNS mask", "Host mask", "Network mask"], "a": 0}, {"q": "¿Qué significa WAN?", "o": ["Wide Area Network", "Wireless Area Network", "Web Access Node", "Wide Access Node"], "a": 0}, {"q": "¿Qué ataque intenta engañar al usuario para obtener datos?", "o": ["Phishing", "Routing", "Switching", "Bruteforce"], "a": 0}, {"q": "¿Qué técnica de seguridad evita DHCP falsos?", "o": ["DHCP snooping", "Port scan", "DNSSEC", "NAT"], "a": 0}, {"q": "¿Qué protocolo traduce nombres de dominio a IP?", "o": ["HTTP", "DNS", "SMTP", "FTP"], "a": 1}, {"q": "¿Qué variable PHP contiene datos enviados por POST?", "o": ["$_GET", "$_POST", "$_REQUEST", "$_SERVER"], "a": 1}, {"q": "¿Qué método HTTP envía parámetros en la URL?", "o": ["POST", "GET", "PATCH", "DELETE"], "a": 1}, {"q": "¿Qué significa VPN?", "o": ["Virtual Private Network", "Verified Public Node", "Virtual Protocol Net", "Verified Private Network"], "a": 0}, {"q": "¿Qué servicio mantiene sincronizados relojes en red?", "o": ["DNS", "NTP", "FTP", "ARP"], "a": 1}, {"q": "¿Qué protocolo permite acceso remoto seguro a servidores?", "o": ["FTP", "SSH", "Telnet", "HTTP"], "a": 1}, {"q": "¿Qué archivo Apache registra errores?", "o": ["access.log", "error.log", "server.log", "apache.log"], "a": 1}, {"q": "¿Qué comando activa un sitio Apache?", "o": ["a2ensite", "siteon", "enablehost", "apachehost"], "a": 0}, {"q": "¿Qué puerto usa SMTP?", "o": ["25", "80", "443", "21"], "a": 0}];
const quiz=document.getElementById("quiz");

function render(){
questions.forEach((q,i)=>{
let div=document.createElement("div");
div.className="card";
div.id="q"+i;
let html=`<h3>${i+1}. ${q.q}</h3>`;
q.o.forEach((opt,j)=>{
html+=`<label class="option"><input type="radio" name="q${i}" value="${j}" onchange="check(${i})"> ${opt}</label>`;
});
html+=`<div id="fb${i}"></div>`;
div.innerHTML=html;
quiz.appendChild(div);
});
}

function check(i){
let q=questions[i];
let sel=document.querySelector(`input[name=q${i}]:checked`);
let card=document.getElementById("q"+i);
let fb=document.getElementById("fb"+i);

if(Number(sel.value)==q.a){
card.className="card correct";
fb.innerHTML="😇 Correcto";
}else{
card.className="card incorrect";
fb.innerHTML="😈 Incorrecto. Respuesta correcta: "+q.o[q.a];
}
}

function corregirTodo(){
questions.forEach((_,i)=>check(i));
alert("Alberto está observando tu examen 😈");
}

render();
</script>
</body>
</html>
