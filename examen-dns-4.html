<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examen DNS 4</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f7efe8, #f4e1d2);
      color: #2f1f16;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #ead3c4;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
      color: #7a2f00;
    }

    .timer {
      font-weight: 700;
      background: #fff3eb;
      color: #b34700;
      border: 1px solid #f1c9ae;
      padding: 10px 16px;
      border-radius: 999px;
      min-width: 140px;
      text-align: center;
    }

    .container {
      max-width: 1050px;
      margin: 30px auto;
      padding: 0 18px 50px;
    }

    .intro {
      background: #fffaf7;
      border: 1px solid #efd6c7;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(122, 47, 0, 0.08);
      margin-bottom: 24px;
    }

    .intro h2 {
      margin: 0 0 10px;
      color: #7a2f00;
    }

    .intro p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: #fff7f1;
      border: 1px solid #e8c9b3;
      color: #7a2f00;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tab-btn:hover {
      background: #fff1e8;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #ff7a18, #ff9b3d);
      color: white;
      border-color: transparent;
    }

    .exam-panel {
      display: none;
    }

    .exam-panel.active {
      display: block;
    }

    .exam-box {
      background: #fff;
      border: 1px solid #edd7ca;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(122, 47, 0, 0.08);
    }

    .question {
      background: #fffaf7;
      border: 1px solid #f1ddd1;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .question h3 {
      margin: 0 0 14px;
      font-size: 21px;
      color: #2b190f;
    }

    .option {
      display: block;
      padding: 12px 14px;
      border: 1px solid #ead8cc;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s ease;
      background: #fff;
    }

    .option:hover {
      background: #fff4ed;
      border-color: #e4b899;
    }

    .option input {
      margin-right: 10px;
      transform: scale(1.1);
    }

    .question.locked .option {
      cursor: not-allowed;
      opacity: 0.96;
    }

    .option.correct {
      background: #eaf8ea;
      border-color: #45a049;
      color: #1d5f23;
      font-weight: 700;
    }

    .option.incorrect {
      background: #fdecec;
      border-color: #d64545;
      color: #9f1d1d;
      font-weight: 700;
    }

    .feedback {
      margin-top: 8px;
      font-weight: 700;
      font-size: 17px;
    }

    .feedback.ok { color: #1f7a2f; }
    .feedback.bad { color: #c62828; }

    .controls {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 28px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-finish {
      background: linear-gradient(135deg, #ff7a18, #ff9b3d);
      color: white;
    }

    .btn-finish:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(255, 122, 24, 0.25);
    }

    .btn-reset {
      background: #fff;
      color: #7a2f00;
      border: 1px solid #e6c3ad;
    }

    .btn-reset:hover {
      background: #fff6f0;
    }

    .result {
      margin-top: 28px;
      padding: 22px;
      border-radius: 18px;
      background: #fff6ef;
      border: 1px solid #efcfba;
      display: none;
    }

    .result h2 {
      margin-top: 0;
      color: #7a2f00;
    }

    .muted {
      color: #7b665c;
      font-size: 14px;
    }

    .panel-info {
      font-size: 14px;
      color: #8b6e60;
      margin: 0 0 16px;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .topbar {
        flex-direction: column;
        gap: 10px;
      }

      .question h3 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Examen DNS 4 · Tipo test</h1>
    <div class="timer" id="timer">Tiempo: 25:00</div>
  </div>

  <div class="container">
    <div class="intro">
      <h2>Práctica de DNS</h2>
      <p>Este examen tiene 40 preguntas divididas en 2 pestañas de 20 preguntas cada una.</p>
      <p class="muted">Se corrige al instante, no permite cambiar la respuesta una vez marcada y tiene temporizador.</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab(0)">Bloque 1 · Preguntas 1-20</button>
      <button class="tab-btn" onclick="showTab(1)">Bloque 2 · Preguntas 21-40</button>
    </div>

    <div class="exam-panel active" id="panel0">
      <div class="exam-box">
        <p class="panel-info">Bloque 1 de DNS</p>
        <div id="exam0"></div>
      </div>
    </div>

    <div class="exam-panel" id="panel1">
      <div class="exam-box">
        <p class="panel-info">Bloque 2 de DNS</p>
        <div id="exam1"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-finish" onclick="finishExam()">Finalizar examen</button>
      <button class="btn-reset" onclick="location.reload()">Reiniciar</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    const allQuestions = [
      {
        q: '1. ¿Qué directiva controla quién puede hacer consultas DNS al servidor?',
        options: ['allow-recursion', 'allow-query', 'forwarders', 'listen-on'],
        answer: 1
      },
      {
        q: '2. ¿Qué significa "allow-query { any; };"?',
        options: ['Que nadie puede consultar', 'Que cualquiera puede consultar', 'Que solo localhost puede consultar', 'Que solo la red local puede consultar'],
        answer: 1
      },
      {
        q: '3. ¿Qué directiva controla quién puede usar la recursión?',
        options: ['allow-query', 'allow-recursion', 'forwarders', 'zone'],
        answer: 1
      },
      {
        q: '4. Si aparece "recursion no;", significa que...',
        options: ['El servidor no resolverá consultas recursivas', 'El servidor no escucha', 'El servidor no tiene zona', 'El servidor solo usa IPv6'],
        answer: 0
      },
      {
        q: '5. ¿Para qué sirve "forwarders { 8.8.8.8; 1.1.1.1; };"?',
        options: ['Para definir DNS externos a los que reenviar consultas', 'Para asignar IP a hosts', 'Para activar CNAME', 'Para limitar clientes'],
        answer: 0
      },
      {
        q: '6. ¿Qué significa "forward only;"?',
        options: ['Solo reenvía a los forwarders y si fallan, falla', 'Reenvía y si falla resuelve él mismo', 'No usa nunca forwarders', 'Solo resuelve zonas inversas'],
        answer: 0
      },
      {
        q: '7. ¿Qué significa "forward first;"?',
        options: ['Primero reenvía y si falla intenta resolver él mismo', 'Solo usa localhost', 'Desactiva la recursión', 'Hace consultas solo IPv6'],
        answer: 0
      },
      {
        q: '8. ¿Qué hace "listen-on { 127.0.0.1; 10.0.2.50; };"?',
        options: ['Define en qué IP escucha el servidor DNS', 'Define quién puede consultar', 'Define el servidor maestro', 'Define las zonas'],
        answer: 0
      },
      {
        q: '9. ¿Qué hace un registro A?',
        options: ['Asocia un nombre con una IP', 'Asocia una IP con un alias', 'Crea una delegación', 'Activa la recursión'],
        answer: 0
      },
      {
        q: '10. ¿Qué hace un registro CNAME?',
        options: ['Asigna una IP directamente', 'Define un alias hacia otro nombre', 'Define el servidor NS', 'Define el correo'],
        answer: 1
      },
      {
        q: '11. Si "web IN CNAME app" y "app IN A 10.0.2.60", la IP de web será...',
        options: ['10.0.2.60', '127.0.0.1', 'Depende del NS', 'Dará error siempre'],
        answer: 0
      },
      {
        q: '12. ¿Qué registro indica el servidor DNS autoritativo de la zona?',
        options: ['A', 'MX', 'NS', 'PTR'],
        answer: 2
      },
      {
        q: '13. El registro SOA contiene información principal de la zona, como...',
        options: ['Servidor maestro y contacto administrativo', 'Solo la IP del host', 'Solo alias', 'Solo forwarders'],
        answer: 0
      },
      {
        q: '14. ¿Qué significa TTL en una zona DNS?',
        options: ['Tiempo de vida de la caché de los registros', 'Tipo de tráfico local', 'Tiempo de transferencia de zona', 'Tabla de logs temporales'],
        answer: 0
      },
      {
        q: '15. ¿Qué hace un registro PTR?',
        options: ['Relaciona IP con nombre', 'Relaciona nombre con IP', 'Define alias', 'Define la recursión'],
        answer: 0
      },
      {
        q: '16. ¿Qué es una zona inversa?',
        options: ['La que resuelve IP a nombre', 'La que resuelve nombre a IP', 'La que solo usa IPv6', 'La que contiene CNAME'],
        answer: 0
      },
      {
        q: '17. Si un nombre tiene CNAME, para saber su IP final hay que...',
        options: ['Seguir el alias hasta encontrar un registro A', 'Mirar el SOA', 'Mirar los forwarders', 'Mirar listen-on'],
        answer: 0
      },
      {
        q: '18. ¿Qué diferencia clave hay entre allow-query y allow-recursion?',
        options: ['Una controla quién pregunta y la otra quién puede resolver recursivamente', 'No hay diferencia', 'Una es para IPv4 y otra para IPv6', 'Una es para Apache y otra para DNS'],
        answer: 0
      },
      {
        q: '19. Si el servidor es autoritativo para una zona...',
        options: ['No necesita forwarders para responder registros de esa zona', 'Siempre usará 8.8.8.8', 'Solo responde si recursion=yes', 'No puede tener SOA'],
        answer: 0
      },
      {
        q: '20. ¿Qué significa "listen-on-v6 { none; };"?',
        options: ['Desactiva IPv6 para el servicio DNS', 'Activa IPv6 en todas las interfaces', 'Bloquea localhost', 'Impide usar CNAME'],
        answer: 0
      },

      {
        q: '21. ¿Qué significa "allow-query { 192.168.20.0/24; 127.0.0.1; };"?',
        options: ['Pueden consultar localhost y la red 192.168.20.0/24', 'Puede consultar cualquiera', 'No puede consultar nadie', 'Solo puede consultar 10.0.2.70'],
        answer: 0
      },
      {
        q: '22. ¿Qué archivo suele contener opciones globales como recursion o forwarders en BIND?',
        options: ['named.conf.options', 'db.local', 'hosts', 'resolv.conf'],
        answer: 0
      },
      {
        q: '23. ¿Qué archivo suele declarar las zonas en BIND?',
        options: ['named.conf.local', 'passwd', 'fstab', 'interfaces'],
        answer: 0
      },
      {
        q: '24. ¿Qué hace un registro MX?',
        options: ['Indica el servidor de correo del dominio', 'Asocia nombre con IP', 'Crea una zona inversa', 'Desactiva la recursión'],
        answer: 0
      },
      {
        q: '25. ¿Qué pasa si un servidor tiene recursion yes pero allow-recursion restringido?',
        options: ['Solo algunos clientes podrán usar la recursión', 'Todos podrán usarla', 'Nadie podrá consultar', 'Se desactiva la zona'],
        answer: 0
      },
      {
        q: '26. ¿Qué es un servidor autoritativo?',
        options: ['El que tiene los datos oficiales de la zona', 'El que siempre usa forwarders', 'El que solo hace DHCP', 'El que solo responde por IPv6'],
        answer: 0
      },
      {
        q: '27. ¿Qué es la resolución recursiva?',
        options: ['El servidor busca la respuesta completa por el cliente', 'El cliente pregunta a todos los servidores', 'Solo sirve para zonas inversas', 'Es lo mismo que CNAME'],
        answer: 0
      },
      {
        q: '28. ¿Qué es la resolución iterativa?',
        options: ['El servidor va indicando a qué servidor preguntar después', 'El servidor resuelve todo por el cliente', 'Es un tipo de PTR', 'Es exclusiva de IPv6'],
        answer: 0
      },
      {
        q: '29. ¿Qué hace un registro NS dentro de una zona?',
        options: ['Define el servidor de nombres de la zona', 'Define la IP de un host', 'Define un alias', 'Define el router'],
        answer: 0
      },
      {
        q: '30. ¿Qué parámetro del SOA se incrementa cuando cambias una zona?',
        options: ['El serial', 'El refresh', 'El retry', 'El expire'],
        answer: 0
      },
      {
        q: '31. ¿Qué función tiene el campo refresh del SOA?',
        options: ['Indica cada cuánto revisan la zona los servidores secundarios', 'Marca el TTL del navegador', 'Marca el puerto DNS', 'Marca el tiempo del DHCP'],
        answer: 0
      },
      {
        q: '32. ¿Qué función tiene el campo retry del SOA?',
        options: ['Indica cuándo volver a intentar la transferencia si falla', 'Indica el tiempo de vida de un registro A', 'Indica quién puede consultar', 'Indica el alias principal'],
        answer: 0
      },
      {
        q: '33. ¿Qué función tiene el campo expire del SOA?',
        options: ['Indica cuánto tiempo puede seguir usando la zona un secundario sin actualizar', 'Indica el tiempo del examen', 'Indica el tiempo de caché del cliente', 'Indica el tiempo del CNAME'],
        answer: 0
      },
      {
        q: '34. ¿Qué suele representar el punto final en "ns1.sri.local."?',
        options: ['Que es un nombre absoluto completo', 'Que es un alias', 'Que es IPv6', 'Que pertenece a una zona inversa'],
        answer: 0
      },
      {
        q: '35. En DNS, ¿qué ocurre si preguntas por un nombre que no existe en una zona autoritativa?',
        options: ['El servidor puede responder que no existe ese nombre', 'Crea el registro automáticamente', 'Lo convierte en CNAME', 'Lo manda a DHCP'],
        answer: 0
      },
      {
        q: '36. ¿Qué relación hay entre nombre y dirección IP en una zona directa?',
        options: ['Se resuelve de nombre a IP', 'Se resuelve de IP a nombre', 'No hay ninguna', 'Solo se usa con PTR'],
        answer: 0
      },
      {
        q: '37. ¿Qué relación hay entre dirección IP y nombre en una zona inversa?',
        options: ['Se resuelve de IP a nombre', 'Se resuelve de nombre a IP', 'Es igual que un MX', 'Solo vale para CNAME'],
        answer: 0
      },
      {
        q: '38. ¿Qué se recomienda hacer tras modificar una zona DNS?',
        options: ['Incrementar el serial y recargar el servicio', 'Borrar el SOA', 'Eliminar el NS', 'Desactivar listen-on'],
        answer: 0
      },
      {
        q: '39. ¿Qué hace "allow-query { localhost; };"?',
        options: ['Solo el propio servidor puede consultar', 'Puede consultar toda la red', 'Activa forward only', 'Desactiva el servicio'],
        answer: 0
      },
      {
        q: '40. ¿Qué directiva usarías para decir en qué IP escucha BIND?',
        options: ['listen-on', 'allow-query', 'allow-recursion', 'forwarders'],
        answer: 0
      }
    ];

    const blocks = [
      allQuestions.slice(0, 20),
      allQuestions.slice(20, 40)
    ];

    let score = 0;
    let answered = 0;
    let examFinished = false;

    function renderBlock(blockQuestions, containerId, blockIndex) {
      const exam = document.getElementById(containerId);

      blockQuestions.forEach((item, index) => {
        const globalIndex = blockIndex * 20 + index;
        const div = document.createElement('div');
        div.className = 'question';
        div.dataset.index = globalIndex;

        let html = `<h3>${item.q}</h3>`;
        item.options.forEach((opt, i) => {
          html += `
            <label class="option" id="q${globalIndex}_opt${i}">
              <input type="radio" name="q${globalIndex}" value="${i}">
              ${String.fromCharCode(65 + i)}) ${opt}
            </label>
          `;
        });
        html += `<div class="feedback" id="feedback${globalIndex}"></div>`;
        div.innerHTML = html;
        exam.appendChild(div);
      });
    }

    renderBlock(blocks[0], 'exam0', 0);
    renderBlock(blocks[1], 'exam1', 1);

    document.body.addEventListener('change', function(e) {
      if (examFinished) return;
      if (e.target.type !== 'radio') return;

      const input = e.target;
      const qIndex = Number(input.name.replace('q', ''));
      const selected = Number(input.value);
      const question = allQuestions[qIndex];
      const questionBox = document.querySelector(`.question[data-index="${qIndex}"]`);

      if (questionBox.classList.contains('locked')) return;

      questionBox.classList.add('locked');
      answered++;

      const allInputs = questionBox.querySelectorAll('input');
      allInputs.forEach(r => r.disabled = true);

      const feedback = document.getElementById(`feedback${qIndex}`);
      const correctLabel = document.getElementById(`q${qIndex}_opt${question.answer}`);
      const selectedLabel = document.getElementById(`q${qIndex}_opt${selected}`);

      if (selected === question.answer) {
        score++;
        selectedLabel.classList.add('correct');
        feedback.textContent = '✔ Correcta';
        feedback.className = 'feedback ok';
      } else {
        selectedLabel.classList.add('incorrect');
        correctLabel.classList.add('correct');
        feedback.textContent = `✘ Incorrecta. Respuesta correcta: ${String.fromCharCode(65 + question.answer)}) ${question.options[question.answer]}`;
        feedback.className = 'feedback bad';
      }

      if (answered === allQuestions.length) {
        finishExam();
      }
    });

    function showTab(tabIndex) {
      const panels = document.querySelectorAll('.exam-panel');
      const buttons = document.querySelectorAll('.tab-btn');

      panels.forEach((panel, i) => {
        panel.classList.toggle('active', i === tabIndex);
      });

      buttons.forEach((btn, i) => {
        btn.classList.toggle('active', i === tabIndex);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function finishExam() {
      if (examFinished) return;
      examFinished = true;
      clearInterval(timerInterval);

      const unanswered = allQuestions.length - answered;
      const percentage = Math.round((score / allQuestions.length) * 100);

      const resultBox = document.getElementById('result');
      resultBox.style.display = 'block';
      resultBox.innerHTML = `
        <h2>Resultado final</h2>
        <p><strong>Aciertos:</strong> ${score} de ${allQuestions.length}</p>
        <p><strong>Fallos:</strong> ${allQuestions.length - score}</p>
        <p><strong>Sin responder:</strong> ${unanswered}</p>
        <p><strong>Nota:</strong> ${percentage}%</p>
        <p>${percentage >= 70 ? '✅ Buen trabajo' : '📚 Sigue practicando, vas avanzando'}</p>
      `;

      document.querySelectorAll('input[type="radio"]').forEach(input => {
        input.disabled = true;
      });

      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    let totalSeconds = 25 * 60;
    const timerEl = document.getElementById('timer');

    function updateTimer() {
      const min = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const sec = String(totalSeconds % 60).padStart(2, '0');
      timerEl.textContent = `Tiempo: ${min}:${sec}`;

      if (totalSeconds <= 0) {
        timerEl.textContent = 'Tiempo: 00:00';
        finishExam();
        return;
      }
      totalSeconds--;
    }

    updateTimer();
    const timerInterval = setInterval(updateTimer, 1000);
  </script>
</body>
</html>
