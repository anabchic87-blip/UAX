<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTEGRA FORMACIÓN · Campus</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<h2>Panel envío de correos</h2>

<input id="mailDestino" placeholder="correo destino"><br><br>
<input id="mailAsunto" placeholder="asunto"><br><br>
<input id="mailMensaje" placeholder="mensaje"><br><br>

<button onclick="enviarCorreoAlumno()">Enviar</button>

<script>
const EMAILJS_PUBLIC_KEY = 'yPR0JvvIX3Q3o3Bns';
const EMAILJS_SERVICE_ID = 'service_tsflpx4';
const EMAILJS_TEMPLATE_ID = 'template_d9xcaxo';

emailjs.init(EMAILJS_PUBLIC_KEY);

function isAdminRole(){ return true; } // simplificado para test

async function enviarCorreoAlumno(){

  const destino = document.getElementById('mailDestino').value.trim();
  const asunto = document.getElementById('mailAsunto').value.trim();
  const mensaje = document.getElementById('mailMensaje').value.trim();

  if(!destino || !asunto || !mensaje){
    alert('Completa todos los campos');
    return;
  }

  try{
    const response = await emailjs.send(
      EMAILJS_SERVICE_ID,
      EMAILJS_TEMPLATE_ID,
      {
        to_email: destino,
        to_name: destino.split('@')[0],
        subject: asunto,
        message: mensaje
      }
    );

    console.log('OK:', response);
    alert('Correo enviado correctamente');

  }catch(e){
    console.error('ERROR:', e);
    alert('Error real: ' + (e.text || e.message));
  }
}
</script>

</body>
</html>
