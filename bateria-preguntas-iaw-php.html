<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batería de preguntas IAW/PHP</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#eef2f7;
  color:#1b1f24;
}
.wrapper{
  max-width:1150px;
  margin:24px auto;
  padding:0 16px 40px;
}
.header{
  background:#fff;
  border-radius:18px;
  padding:28px;
  box-shadow:0 10px 30px rgba(0,0,0,0.10);
  margin-bottom:20px;
}
h1{margin:0 0 10px;font-size:32px}
.subtitle{margin:0;color:#58606b;font-size:16px;line-height:1.6}
.levels{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.level-btn{
  border:none;
  border-radius:12px;
  padding:12px 18px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
.facil{background:#dcfce7;color:#166534}
.medio{background:#fef3c7;color:#92400e}
.imposible{background:#fee2e2;color:#991b1b}
.examen{background:#2563eb;color:#fff}
.stats{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:18px;
}
.stat{
  background:#f6f8fb;
  border:1px solid #dbe3ee;
  border-radius:12px;
  padding:10px 14px;
  min-width:140px;
}
.stat-label{font-size:12px;color:#66707c;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:700}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
button{
  border:none;
  border-radius:10px;
  padding:12px 18px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
.primary{background:#2563eb;color:#fff}
.secondary{background:#111827;color:#fff}
.ghost{background:#e5e7eb;color:#111827}
.quiz-item{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 8px 24px rgba(0,0,0,0.08);
  margin-bottom:16px;
  border:2px solid transparent;
}
.quiz-item.correct{border-color:#18a957;background:#f3fff8}
.quiz-item.incorrect{border-color:#e53935;background:#fff6f6}
.question-title{font-size:20px;margin:0 0 14px;line-height:1.4}
.meta{font-size:12px;color:#66707c;margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px}
.options{display:grid;gap:10px}
.option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border:1px solid #d8e0ea;
  border-radius:12px;
  background:#f8fafc;
}
.option input{margin:0;transform:scale(1.1)}
.feedback{
  margin-top:14px;
  padding:12px 14px;
  border-radius:12px;
  font-weight:700;
  display:none;
  line-height:1.5;
}
.feedback.show{display:block}
.feedback.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
.feedback.bad{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.correct-answer{margin-top:8px;font-weight:600}
.banner{
  margin-top:16px;
  padding:12px 14px;
  border-radius:12px;
  background:#eff6ff;
  color:#1d4ed8;
  border:1px solid #bfdbfe;
  font-weight:700;
}
.footer-note{text-align:center;color:#66707c;margin-top:24px;font-size:14px}
@media (max-width:700px){
  h1{font-size:26px}
  .question-title{font-size:18px}
  .stat{min-width:unset;flex:1 1 120px}
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>Batería de preguntas IAW/PHP</h1>
    <p class="subtitle">Puedes practicar por dificultad o lanzar un examen real con 25 preguntas aleatorias.</p>

    <div class="levels">
      <button class="level-btn facil" onclick="iniciarModo('facil')">Fácil · 25 preguntas</button>
      <button class="level-btn medio" onclick="iniciarModo('medio')">Medio · 25 preguntas</button>
      <button class="level-btn imposible" onclick="iniciarModo('imposible')">Imposible · 25 preguntas</button>
      <button class="level-btn examen" onclick="iniciarModo('examen')">Modo examen real · 25 preguntas</button>
    </div>

    <div class="banner" id="bannerMode">Elige un modo para empezar.</div>

    <div class="stats">
      <div class="stat"><div class="stat-label">Banco total</div><div class="stat-value" id="totalBank">100</div></div>
      <div class="stat"><div class="stat-label">Preguntas por nivel</div><div class="stat-value" id="loadedQuestions">0</div></div>
      <div class="stat"><div class="stat-label">Aciertos</div><div class="stat-value" id="score">0</div></div>
      <div class="stat"><div class="stat-label">Fallos</div><div class="stat-value" id="errors">0</div></div>
      <div class="stat"><div class="stat-label">Respondidas</div><div class="stat-value" id="answered">0</div></div>
      <div class="stat"><div class="stat-label">Nota / 10</div><div class="stat-value" id="grade">0.00</div></div>
    </div>

    <div class="actions">
      <button class="primary" onclick="entregar()">Entregar / Corregir</button>
      <button class="secondary" onclick="reiniciarModo()">Reiniciar modo</button>
      <button class="ghost" onclick="window.scrollTo({top:0,behavior:'smooth'})">Subir arriba</button>
    </div>
  </div>

  <div id="quiz"></div>

  <p class="footer-note">HTML listo para GitHub Pages y Visual Studio Code.</p>
</div>

let currentMode = null;
let currentQuestions = [];

const quiz = document.getElementById('quiz');

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function setBanner(text) {
  document.getElementById('bannerMode').textContent = text;
}

function iniciarModo(mode) {
  currentMode = mode;
  let source = [];

  if (mode === 'facil') {
    source = bank.filter(q => q.difficulty === 'facil');
    setBanner('Modo práctica fácil: 25 preguntas aleatorias con corrección automática.');
  } else if (mode === 'medio') {
    source = bank.filter(q => q.difficulty === 'medio');
    setBanner('Modo práctica medio: 25 preguntas aleatorias con corrección automática.');
  } else if (mode === 'imposible') {
    source = bank.filter(q => q.difficulty === 'imposible');
    setBanner('Modo práctica imposible: 25 preguntas aleatorias con corrección automática.');
  } else {
    source = bank;
    setBanner('Modo examen real: 25 preguntas aleatorias. No verás si está bien o mal hasta entregar.');
  }

  currentQuestions = shuffle(source).slice(0, 25);
  renderQuiz();
  actualizarResumen();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuiz() {
  quiz.innerHTML = '';

  currentQuestions.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'quiz-item';
    div.id = `question-${index}`;

    const optionsHtml = item.options.map((option, i) => `
      <label class="option">
        <input type="radio" name="q${index}" value="${i}" onchange="alResponder(${index})">
        <span>${option}</span>
      </label>
    `).join('');

    div.innerHTML = `
      <div class="meta">${item.difficulty}</div>
      <h2 class="question-title">${index + 1}. ${item.q}</h2>
      <div class="options">${optionsHtml}</div>
      <div class="feedback" id="feedback-${index}"></div>
    `;
    quiz.appendChild(div);
  });

  document.getElementById('loadedQuestions').textContent = currentQuestions.length;
}

function alResponder(index) {
  if (currentMode !== 'examen') {
    corregirPregunta(index);
  }
  actualizarResumen();
}

function corregirPregunta(index) {
  const item = currentQuestions[index];
  const selected = document.querySelector(`input[name="q${index}"]:checked`);
  const card = document.getElementById(`question-${index}`);
  const feedback = document.getElementById(`feedback-${index}`);

  card.classList.remove('correct','incorrect');
  feedback.classList.remove('show','ok','bad');

  if(!selected) {
    feedback.classList.add('show','bad');
    feedback.innerHTML = `No has contestado esta pregunta.<div class="correct-answer">Respuesta correcta: <strong>${item.options[item.answer]}</strong></div>`;
    card.classList.add('incorrect');
    return;
  }

  const selectedValue = Number(selected.value);

  if(selectedValue === item.answer) {
    card.classList.add('correct');
    feedback.classList.add('show','ok');
    feedback.innerHTML = `✅ Correcta.<div class="correct-answer">${item.explanation}</div>`;
  } else {
    card.classList.add('incorrect');
    feedback.classList.add('show','bad');
    feedback.innerHTML = `❌ Incorrecta.<div class="correct-answer">Respuesta correcta: <strong>${item.options[item.answer]}</strong></div><div class="correct-answer">${item.explanation}</div>`;
  }
}

function actualizarResumen() {
  let score = 0;
  let errors = 0;
  let answered = 0;

  currentQuestions.forEach((item, index) => {
    const selected = document.querySelector(`input[name="q${index}"]:checked`);
    if(selected) {
      answered++;
      if(Number(selected.value) === item.answer) score++;
      else errors++;
    }
  });

  const grade = currentQuestions.length ? ((score / currentQuestions.length) * 10) : 0;

  document.getElementById('score').textContent = score;
  document.getElementById('errors').textContent = errors;
  document.getElementById('answered').textContent = answered;
  document.getElementById('grade').textContent = grade.toFixed(2);
}

function entregar() {
  if (!currentQuestions.length) {
    alert('Primero elige un modo.');
    return;
  }

  currentQuestions.forEach((_, index) => corregirPregunta(index));
  actualizarResumen();

  const score = Number(document.getElementById('score').textContent);
  const grade = Number(document.getElementById('grade').textContent);

  if (currentMode === 'examen') {
    if (grade >= 9) {
      alert(`Examen terminado. Nota: ${grade.toFixed(2)}/10. Resultado excelente.`);
    } else if (grade >= 5) {
      alert(`Examen terminado. Nota: ${grade.toFixed(2)}/10. Aprobado.`);
    } else {
      alert(`Examen terminado. Nota: ${grade.toFixed(2)}/10. Toca repasar.`);
    }
  }
}

function reiniciarModo() {
  currentMode = null;
  currentQuestions = [];
  quiz.innerHTML = '';
  setBanner('Elige un modo para empezar.');
  document.getElementById('loadedQuestions').textContent = '0';
  document.getElementById('score').textContent = '0';
  document.getElementById('errors').textContent = '0';
  document.getElementById('answered').textContent = '0';
  document.getElementById('grade').textContent = '0.00';
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
