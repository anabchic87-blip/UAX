<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asignatura</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#f7efe5;
}

/* HEADER */
.header{
  text-align:center;
  padding:50px 20px 20px;
}

.header h1{
  font-size:32px;
  color:#7c2d12;
}

.header p{
  color:#9a6a4f;
}

/* BOTÓN VOLVER */
.back{
  position:absolute;
  top:20px;
  left:20px;
}

.back a{
  text-decoration:none;
  font-weight:600;
  color:#7c2d12;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  padding:30px;
  max-width:1100px;
  margin:auto;
}

/* CARD */
.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
  transition:0.2s;
}

.card:hover{
  transform:translateY(-5px);
}

/* TOP */
.card-top{
  display:flex;
  justify-content:space-between;
}

.icon-box{
  font-size:22px;
}

.tag{
  background:#fff4ea;
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  color:#c2410c;
}

/* BOTONES */
.actions{
  margin-top:15px;
}

.btn{
  display:inline-block;
  padding:10px 15px;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
}

.btn-primary{
  background:linear-gradient(135deg,#ff7a18,#ff9f43);
  color:white;
}

.btn-secondary{
  background:#f1f5f9;
  color:#334155;
}
</style>
</head>

<body>

<div class="back">
  <a href="../index.html">⬅ Volver</a>
</div>

<div class="header">
  <h1>💻 TAI</h1>
  <p>Selecciona un test para practicar</p>
</div>

<div class="grid">

  <!-- TEST 1 -->
  <article class="card">
    <div class="card-top">
      <div class="icon-box">🧪</div>
      <div class="tag">TEST</div>
    </div>

    <h3>Test 1</h3>

    <p>Descripción del test.</p>

    <div class="actions">
   <a class="btn btn-primary" href="tai_final_completo.html">
  📝 Examen final TAI
</a>
    </div>
  </article>

  <!-- TEST 2 -->
  <article class="card">
    <div class="card-top">
      <div class="icon-box">🧪</div>
      <div class="tag">TEST</div>
    </div>

    <h3>Test 2</h3>

    <p>Próximamente disponible.</p>

    <div class="actions">
      <a class="btn btn-secondary">No disponible</a>
    </div>
  </article>

</div>

</body>
</html>
